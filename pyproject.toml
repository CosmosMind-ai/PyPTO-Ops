[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pypto-ops"
version = "0.1.0"
description = "A PyPTO operator library for LLM inference on Ascend 910C"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pypto_ops*"]
